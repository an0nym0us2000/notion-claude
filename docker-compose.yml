version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: notion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notion
      POSTGRES_PASSWORD: notion_password
      POSTGRES_DB: notion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notion-network

  redis:
    image: redis:7-alpine
    container_name: notion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - notion-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: notion-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://notion:notion_password@postgres:5432/notion_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - notion-network
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: notion-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_WS_URL: ws://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - notion-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  notion-network:
    driver: bridge
